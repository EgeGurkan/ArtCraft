<!doctype html>
<html lang="en" data-theme="system"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Craft Apps</title>
<script>if(!location.pathname.endsWith('/')&&!/\.html?$/i.test(location.pathname)&&location.protocol!=='file:')location.replace(location.pathname+'/'+location.search+location.hash);try{var t=localStorage.getItem('acl.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="https://getartcraft.com/artcraft-icon.svg">
<style>
:root{--bg:#f2f1ee;--fg:#101014;--mut:rgba(16,16,20,.62);--faint:rgba(16,16,20,.42);--line:rgba(16,16,20,.14);--hover:rgba(16,16,20,.05);--btn:#101014;--btnfg:#f2f1ee;--acc:#1a5bc4;--accbg:rgba(26,91,196,.07);--pop:#fbfaf8;--sunken:rgba(16,16,20,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121316;--fg:#f2f1ee;--mut:rgba(242,241,238,.62);--faint:rgba(242,241,238,.42);--line:rgba(242,241,238,.13);--hover:rgba(242,241,238,.05);--btn:#f2f1ee;--btnfg:#121316;--acc:#7fb0ff;--accbg:rgba(127,176,255,.09);--pop:#1b1c20;--sunken:rgba(242,241,238,.04)}:root:not([data-theme=light]) .app{--ink:var(--inkd)}}
:root[data-theme=dark]{--bg:#121316;--fg:#f2f1ee;--mut:rgba(242,241,238,.62);--faint:rgba(242,241,238,.42);--line:rgba(242,241,238,.13);--hover:rgba(242,241,238,.05);--btn:#f2f1ee;--btnfg:#121316;--acc:#7fb0ff;--accbg:rgba(127,176,255,.09);--pop:#1b1c20;--sunken:rgba(242,241,238,.04)}
:root[data-theme=dark] .app{--ink:var(--inkd)}
.app{--ink:var(--inkl)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.hud,.gh,.ver,.by,.pill,.btn,.suite,select,.menu a,.menu button,.tbl th,.mono,.lang{font-family:ui-monospace,"Geist Mono",SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
header{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:48px;flex:none}
.brand{display:flex;align-items:center;padding:0 20px 0 10px;border-right:1px solid var(--line);font:900 20px/1 system-ui,"Segoe UI",sans-serif;letter-spacing:.06em;color:var(--fg);text-decoration:none}
.suite{display:flex;align-items:center;padding:0 16px;font-size:11px;color:var(--mut)}
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 8px 4px;flex-wrap:wrap}
.ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;padding:0}
.ib:hover{background:var(--fg);color:var(--bg)}.ib svg{width:16px;height:16px}
.ib.busy{cursor:progress}.ib.busy svg{animation:acl-spin .9s linear infinite}.ib.err{color:#c0392b}
.lang{width:auto;padding:0 10px;font-size:11px;font-weight:600}
@keyframes acl-spin{to{transform:rotate(360deg)}}
.hud{font-size:10.5px;color:var(--mut)}.faint{color:var(--faint)}
.linkish{background:none;border:0;cursor:pointer;padding:4px 0}.linkish:hover{color:var(--fg)}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select,input[type=search]{height:34px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:0 10px;font-size:11px}
select option{background:var(--pop);color:var(--fg)}
input[type=search]{font:400 13px system-ui,"Segoe UI",sans-serif;width:200px;letter-spacing:0;text-transform:none}
.seg{display:flex}.seg .ib+.ib{border-left:0}.seg .ib[aria-pressed=true]{background:var(--hover);color:var(--fg)}.seg .ib[aria-pressed=false]{color:var(--faint)}
main{padding:8px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
/* Kart: orijinal Launcher'daki gibi (views.rs card): 0.3 sn; zemine %5 uygulama rengi, üstte soldan
   akan 2 px renkli çizgi, ikon 4 px yükselir; kurulu olmayan gri çizilir, hover'da renklenir. */
.card{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-width:0;cursor:pointer;background:var(--bg);transition:background-color .3s linear}
.card::before{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:var(--app);transition:width .3s linear;z-index:1;pointer-events:none}
.card:hover{background:color-mix(in srgb,var(--app) 5%,var(--bg))}
.card:hover::before{width:100%}
.ct{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.ver{font-size:10.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s linear}
.gh{margin-left:auto;font-size:10.5px;color:var(--mut);text-decoration:none}.gh:hover{color:var(--fg)}
.cb{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
.hd{display:flex;gap:14px;align-items:center;min-width:0}
.ic{border-radius:12px;flex:none;display:block;box-shadow:0 6px 14px -4px rgba(0,0,0,.28);background:var(--line);transition:transform .3s linear,filter .3s linear}
.card:hover .ic{transform:translateY(-4px)}
.ph{width:56px;height:56px}
h1,h2{margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-size:22px;line-height:1.15}h1{font-size:34px;line-height:1.1}
.wm{letter-spacing:-.03em}.cr{color:var(--ink);transition:color .3s linear}
.by{font-size:9.5px;font-weight:500;color:var(--acc);background:var(--accbg);border:1px solid var(--line);padding:3px 6px;white-space:nowrap}
.by.com{color:var(--mut);background:transparent}
.tg{margin:3px 0 0;color:var(--mut)}
.pill{align-self:flex-start;font-size:10px;padding:4px 6px;border:1px solid var(--line);background:var(--sunken);color:var(--faint);white-space:nowrap}
.hl{margin:0;color:var(--mut);flex:1}
.act{display:flex;gap:8px;position:relative}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;font-size:11px;font-weight:600;background:var(--btn);color:var(--btnfg);text-decoration:none;border:1px solid var(--btn);cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.86}.btn.sec{background:transparent;color:var(--fg);border-color:var(--line)}.btn.sec:hover{background:var(--hover);opacity:1}
.more{width:36px;height:34px;flex:none;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font-size:14px}.more:hover{color:var(--fg);background:var(--hover)}
.off .ic{filter:grayscale(1)}.off .cr,.off .ver{color:var(--mut)}
.off:hover .ic{filter:none}.off:hover .cr,.off:hover .ver{color:var(--ink)}
.menu{position:absolute;right:0;bottom:40px;z-index:5;min-width:180px;background:var(--pop);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;padding:4px;cursor:default}
.menu a,.menu button{display:block;text-align:left;padding:9px 10px;font-size:10.5px;color:var(--fg);text-decoration:none;background:none;border:0;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--hover)}
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line)}
.tbl th{font-size:10px;font-weight:500;color:var(--faint);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.app{cursor:pointer;transition:background-color .3s linear}
.tbl tr.app:hover td{background:color-mix(in srgb,var(--app) 5%,var(--bg))}
.trow{display:flex;align-items:center;gap:12px;text-decoration:none}.trow b{font-size:15px}.trow small{display:block;color:var(--mut);font-size:12.5px;font-weight:400}
.tbl .act{justify-content:flex-end}.tbl .btn{flex:none;min-width:110px}.tbl .menu{bottom:auto;top:40px}
.mono{font-size:11px;color:var(--mut);white-space:nowrap}
.empty{color:var(--mut);padding:24px 8px}
#details{padding:16px 20px 32px;max-width:1100px;width:100%;margin:0 auto}
.back{display:inline-block;margin-bottom:22px;text-decoration:none}
.dh{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.dh>div{display:flex;flex-direction:column;gap:8px}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.dact .btn{flex:none;min-width:140px}
.dhl{font-size:24px;margin:8px 0 10px}
.about{color:var(--mut);max-width:72ch;margin:0 0 12px;font-size:15px;line-height:1.6}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:24px 0}
.feat{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.feat h3{margin:0 0 6px;font-size:15px}.feat p{margin:0;color:var(--mut)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin:24px 0}
.shots figure{margin:0}.shots img{width:100%;display:block;border:1px solid var(--line)}
.shots figcaption{font-size:12.5px;color:var(--mut);margin-top:6px}
.plat{margin-top:20px}
footer{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:12px 16px;border-top:1px solid var(--line);flex:none}
.social{display:flex;gap:12px;align-items:center}.disc{margin-right:auto;font-size:11px;color:var(--faint)}
.social a{width:18px;height:18px;display:block;background:var(--faint);-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.social a:hover{background:var(--fg)}
@media (prefers-reduced-motion:reduce){.card,.card::before,.ic,.cr,.ver,.tbl tr.app{transition:none!important}}
.sortbox{position:relative;display:inline-flex;align-items:center}.sorti{display:none}#searchbtn{display:none}
/* Masaüstü (DOM sırası): solda tema, EN/TR, yenile, silik "N uygulama"; sağda Sırala, arama, kart/tablo.
   Mobil: tek satır. Solda kart/tablo, sıralama düğmesi (yerel seçim listesi), arama düğmesi;
   sağda "N uygulama", yenile, EN/TR, tema. Arama düğmesi kutuyu alt satırda açar. */
@media (max-width:640px){.toolbar{gap:6px;flex-wrap:wrap}.tr{display:contents}.tr>.hud{display:none}
 .seg{order:1}
 .sortbox{order:2;width:34px;height:34px;justify-content:center;border:1px solid var(--line);color:var(--fg)}
 .sortbox:active{background:var(--hover)}.sorti{display:block;width:16px;height:16px;pointer-events:none}
 #sort{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;font-size:16px;cursor:pointer}
 #searchbtn{display:inline-flex;order:3}#searchbtn.on{background:var(--hover)}
 #count{order:4;margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#hidden{order:5}
 #refresh{order:6}#lang{order:7}#theme{order:8}
 #q{order:9;display:none;flex:1 1 100%;width:100%}.toolbar.searching #q{display:block}
 .grid{grid-template-columns:1fr}.brand{font-size:17px}h1{font-size:26px}.tbl th:nth-child(3),.tbl td:nth-child(3){display:none}}
</style></head><body>

// Uygulamaların açılacağı adres. Sunucudaki sayfada './'. Dışa aktarılmış (statik) sayfada adres dosyada
// bulunmaz: bir kez ?server=https://…/ ile verilir, bu tarayıcıda saklanır ve adres çubuğundan silinir;
// verilmemişse Open'a ilk tıklamada sorulur. Yalnızca https:// (veya yerel http) kabul edilir.
function normServer(s){s=String(s||'').trim();if(!/^https:\/\/[^\s"'<>]+$/i.test(s)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/[^\s"'<>]*)?$/i.test(s))return null;return s.replace(/\/+$/,'')+'/'}

// sürümler, tarihler); 2) sunucuya ulaşılamazsa getartcraft.com'daki katalog (imzası sabitlenmiş

 web:/^https:\/\/[^\s"'<>]+$/,rgb:/^rgb\(\d{1,3},\d{1,3},\d{1,3}\)$/,ver:/^[0-9A-Za-z.+-]{0,40}$/};

 var nm=str(a.name)||a.id,m=nm.match(/^(.+?)Craft$/),col=RX.rgb.test(str(a.color))?a.color:null;
 return {id:a.id,order:i,name:nm,base:m?m[1]:nm,craft:!!m,publisher:str(a.publisher)||'ArtCraft',kind:str(a.kind),repo:a.repo,
  website:RX.web.test(str(a.website))?a.website:'https://github.com/'+a.repo,tagline:str(a.tagline),headline:str(a.headline),about:str(a.about),platforms:str(a.platforms),
  features:(Array.isArray(a.features)?a.features:[]).filter(Boolean).map(function(f){return {title:str(f.title),text:str(f.text)}}),
  shots:(Array.isArray(a.shots)?a.shots:[]).map(function(x){var u=x&&(RX.shot.test(str(x.url))?x.url:RX.shot.test(str(x.src))?x.src:null);return u?{caption:str(x.caption),src:u,url:u}:null}).filter(Boolean),
  icon:false,iconUrl:RX.icon.test(str(a.iconUrl))?a.iconUrl:null,installed:a.installed!==false,
  version:RX.ver.test(str(a.version))?str(a.version):'',latest:RX.ver.test(str(a.latest))?str(a.latest):'',activated:str(a.activated)&&!isNaN(Date.parse(a.activated))?a.activated:'',
  color:col||'rgb(128,128,128)',inkl:RX.rgb.test(str(a.inkl))?a.inkl:(col||'rgb(90,90,90)'),inkd:RX.rgb.test(str(a.inkd))?a.inkd:(col||'rgb(170,170,170)')}}

function b64(s){var b=atob(String(s).trim()),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function parseCatalog(t){var list=[],cur=null,sec='',item=null,allow=(D.catalog&&D.catalog.allow)||[];
 t.split(/\r?\n/).forEach(function(l){var m,k,v,s=null,q,c;
  if(/^\[\[apps\]\]/.test(l)){cur={features:[],shots:[]};list.push(cur);sec='app';return}
  if(/^\[apps\.details\]\s*$/.test(l)){sec='details';return}
  if(/^\[\[apps\.details\.features\]\]/.test(l)){item={};if(cur)cur.features.push(item);sec='feature';return}
  if(/^\[\[apps\.details\.shots\]\]/.test(l)){item={};if(cur)cur.shots.push(item);sec='shot';return}
  if(/^\[/.test(l)){sec='';return}
  if(!cur||!(m=l.match(/^([a-z0-9_]+)\s*=\s*(.*)$/)))return;
  k=m[1];v=m[2].trim();q=v.match(/^"(.*)"$/);if(q)s=q[1].replace(/\\(["\\nt])/g,function(_,x){return x==='n'?'\n':x==='t'?'\t':x});
  c=v.match(/^\[\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\]$/);
  if(sec==='app'){if(s!==null&&/^(id|name|repo|kind|publisher|tagline|icon_url|website)$/.test(k))cur[k==='icon_url'?'iconUrl':k]=s;
   if(c&&/^(color|ink_light|ink_dark)$/.test(k))cur[{color:'color',ink_light:'inkl',ink_dark:'inkd'}[k]]='rgb('+c[1]+','+c[2]+','+c[3]+')'}
  else if(sec==='details'){if(s!==null&&/^(headline|about|platforms)$/.test(k))cur[k]=s}
  else if(sec==='feature'){if(s!==null&&/^(title|text)$/.test(k))item[k]=s}
  else if(sec==='shot'){if(s!==null&&/^(caption|key|url)$/.test(k))item[k]=s}});
 return list.filter(function(a){return RX.id.test(str(a.id))&&((a.kind==='official'&&/^storytold\/[A-Za-z0-9._-]+$/.test(str(a.repo)))||(a.kind==='community'&&allow.indexOf(a.repo)>=0))})}
function loadCatalog(){if(!D.catalog||!window.crypto||!crypto.subtle||!window.TextDecoder)return Promise.reject(0);
 var u='https://getartcraft.com/launcher-catalog.toml',o={cache:'no-cache',credentials:'omit',referrerPolicy:'no-referrer'};
 return Promise.all([fetch(u,o).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}),fetch(u+'.sig',o).then(function(r){if(!r.ok)throw 0;return r.text()})]).then(function(x){
  return crypto.subtle.importKey('spki',b64(D.catalog.key),{name:'Ed25519'},false,['verify']).then(function(key){return crypto.subtle.verify({name:'Ed25519'},key,b64(x[1]),x[0])}).then(function(ok){

function icon(a,s){var src=D.static?a.iconUrl:(a.icon?'./icons/'+a.id+'.png':a.iconUrl);return src?el('img',{class:'ic',src:src,alt:'',width:s,height:s,referrerpolicy:'no-referrer'}):el('span',{class:'ic ph',style:'width:'+s+'px;height:'+s+'px'})}

function closeMenu(){var m=document.querySelector('.menu');if(m)m.remove()}

function table(l){return el('table',{class:'tbl'},
 el('thead',{},el('tr',{},el('th',{},T('colApp')),el('th',{},T('colVer')),el('th',{},T('colUpd')),el('th',{}))),
 el('tbody',{},l.map(function(a){return openOnClick(el('tr',{class:'app'+(a.installed?'':' off'),style:appStyle(a)},
  el('td',{},el('a',{class:'trow',href:'#app/'+encodeURIComponent(a.id)},icon(a,32),el('span',{},el('b',{},nameNode(a)),el('small',{},a.tagline)))),
  el('td',{class:'mono'},ver(a)||'—'),
  el('td',{class:'mono'},a.activated?fmtDate(a.activated):'—'),

function visible(){var n=q.trim().toLowerCase();return D.apps.filter(function(a){return (showHidden?hidden.has(a.id):!hidden.has(a.id))&&(!n||(a.name+' '+a.tagline+' '+a.id+' '+(a.headline||'')).toLowerCase().indexOf(n)>=0)})}
function sorted(l){var s=l.slice();if(sort==='name')s.sort(function(x,y){return x.name.localeCompare(y.name)});else if(sort==='updated')s.sort(function(x,y){return (y.activated||'').localeCompare(x.activated||'')});else s.sort(function(x,y){return x.order-y.order});return s}
function render(){var l=sorted(visible());

function details(a){var s=$('#details'),site=a.website||'https://github.com/'+a.repo;

 s.replaceChildren(
  el('a',{class:'back hud',href:'#'},'← '+T('back')),
  el('div',{class:'dh'},icon(a,96),el('div',{},el('h1',{},nameNode(a),by(a)),el('p',{class:'tg'},a.tagline),a.installed?el('span',{class:'ver'},ver(a)):el('span',{class:'pill'},T('desktop')))),
  el('div',{class:'dact'},primary(a),ext(site,T('website')+' ↗','btn sec'),ext('https://github.com/'+a.repo,'GitHub ↗','btn sec'),ext('https://github.com/'+a.repo+'/releases',T('releases')+' ↗','btn sec')),
  a.headline?el('h2',{class:'dhl'},a.headline):null,el('div',{},about),
  a.features.length?el('div',{class:'feats'},a.features.map(function(f){return el('div',{class:'feat'},el('h3',{},f.title),el('p',{},f.text))})):null,

  a.platforms?el('p',{class:'plat hud'},T('platforms')+' · '+a.platforms):null)}
function route(){var m=location.hash.match(/^#app\/(.+)$/),a=null;if(m){var id=decodeURIComponent(m[1]);a=D.apps.filter(function(x){return x.id===id})[0]||null}

var mq=window.matchMedia('(prefers-color-scheme: dark)');

// Mobil arama düğmesi: kutuyu açar/kapatır; boşken odak kaybında kapanır.

function setSearching(on){tb.classList.toggle('searching',on);sb.classList.toggle('on',on);sb.setAttribute('aria-expanded',String(on))}

// Refresh: sunucuda uygulama güncellemesini başlatır; bitince yeni sürüm kurulduysa sayfayı yeniler.
function poll(){if(polling)return;polling=true;setBusy(true,'checking');
 (function tick(){fetch('./api/status',{cache:'no-store'}).then(function(r){return r.json()}).then(function(s){
  if(s.running){setTimeout(tick,2000);return}
  polling=false;
  if(s.updated&&s.updated.length){location.reload();return}
  var f=s.failed&&s.failed.length;setBusy(false,f?'failed':'uptodate',f?s.failed.join(', '):'');rb.classList.toggle('err',!!f)
 }).catch(function(){polling=false;setBusy(false,'unavail');rb.classList.add('err')})})()}
rb.addEventListener('click',function(){if(rb.disabled)return;rb.classList.remove('err');setBusy(true,'checking');
 fetch('./api/update',{method:'POST',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;poll()}).catch(function(){setBusy(false,'unavail');rb.classList.add('err')})});
// Dışa aktarılmış (GitHub) sayfada sunucuya komut gönderilemez (farklı köken): yenile düğmesi gizlenir.
if(D.static){rb.hidden=true;
 // Önceki sürümün tarayıcıda bıraktığı liste kopyası silinir (liste artık saklanmaz).
 try{localStorage.removeItem('acl.data')}catch(e){}
}else{
fetch('./api/status',{cache:'no-store'}).then(function(r){return r.json()}).then(function(s){if(s.running)poll()}).catch(function(){});}
applyLang();
loadLive();
})();
